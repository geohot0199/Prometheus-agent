name: prometheus
version: 1.0.0
description: "Dashboard auth provider — OAuth 2.0 (authorization-code + PKCE) against Prometheus Portal. Auto-activates when a client_id is configured via either dashboard.oauth.client_id in config.yaml (canonical surface) or PROMETHEUS_DASHBOARD_OAUTH_CLIENT_ID env var (operator override; Portal injects this at Fly.io provisioning). dashboard.oauth.portal_url / PROMETHEUS_DASHBOARD_PORTAL_URL are optional and default to https://geohot0199.github.io/prometheus-agent/portal."
author: geohot0199
kind: backend
requires_env:
  - PROMETHEUS_DASHBOARD_OAUTH_CLIENT_ID
